[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "Local code agent skeleton"
license = {text = "Apache-2.0"}
authors = [{name = "CodeOps-Agent contributors"}]
requires-python = ">=3.11"

dependencies = [
    "protobuf>=5.26,<6",          # required by grpcio-tools 1.71+ codegen (runtime_version)
    "grpcio>=1.60,<2",
    "langgraph>=0.2,<1",
    "langgraph-checkpoint-sqlite>=2,<4",
    "grpcio-tools>=1.71,<2",      # protoc 29.0 embedded → generates protobuf 5.x API
    "langchain-core>=0.3,<1",
]

[project.optional-dependencies]
context = [
    # Optional remote persistence adapters. SQLite remains the zero-config default.
    "pymysql>=1.1,<2",
    "redis>=5,<7",
]
rag = [
    # Runtime imports for orchestrator.rag. Keep these optional because the Go
    # harness does not need the Python HTTP/RAG service installed.
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "langchain-openai>=0.2,<1",
    "langchain-text-splitters>=0.3,<1",
    "openpyxl>=3.1,<4",
    "pydantic>=2.7,<3",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "typing-extensions>=4.12,<5",
    "uvicorn>=0.29,<1",
]
audio = [
    # The real LibriSpeech runner records this parser version in its receipt.
    # Keep ASR separate so document-only RAG installs stay lightweight.
    "faster-whisper==1.2.1",
]
trace-e2e = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
eval = [
    # imported by eval/benchmarks/evalplus.py and scripts/corpus/scan_contamination.py,
    # previously undeclared.  Capped below 2.0: verified only against 1.26.x, and
    # numpy 2.0 removed APIs these modules have not been re-checked against.
    "numpy>=1.26,<2",
]
test = [
    # Direct imports used by the repository test suite. Keep these explicit so
    # a clean checkout can reproduce validation without relying on transitive
    # packages or a developer's global Python environment.
    "cryptography>=43,<47",
    "jsonschema>=4.23,<5",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "pymysql>=1.1,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "terminal-bench==0.2.18; python_version >= '3.12'",
]
visual-eval = [
    # Pinned model revisions are recorded by the runner; these are the runtime
    # libraries needed to reproduce the public visual and late-interaction arms.
    "colpali-engine==0.3.17",
    "datasets>=3,<5",
    "peft>=0.17,<0.21",
    "pillow>=10,<12",
]

[tool.setuptools.packages.find]
include = ["codeagent*", "orchestrator*"]

[tool.setuptools.package-data]
orchestrator = ["prompts/templates/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# The repository does not depend on Phoenix's global pytest plugin. Disabling
# the externally installed entry point keeps the canonical test command
# isolated from optional tracing packages and their MCP client versions.
addopts = ["-p", "no:phoenix"]
markers = [
    "integration: explicit tests that require local external runtimes",
]
