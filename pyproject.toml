[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "Local code agent skeleton"
requires-python = ">=3.11"

dependencies = [
    "protobuf>=5.26,<6",          # required by grpcio-tools 1.71+ codegen (runtime_version)
    "grpcio>=1.60,<2",
    "grpcio-tools>=1.71,<2",      # protoc 29.0 embedded → generates protobuf 5.x API
]

[project.optional-dependencies]
trace-e2e = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
eval = [
    # imported by eval/benchmarks/evalplus.py and scripts/corpus/scan_contamination.py,
    # previously undeclared.  Capped below 2.0: verified only against 1.26.x, and
    # numpy 2.0 removed APIs these modules have not been re-checked against.
    "numpy>=1.26,<2",
]

[tool.setuptools.packages.find]
include = ["codeagent*", "orchestrator*"]

[tool.setuptools.package-data]
orchestrator = ["prompts/templates/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: explicit tests that require local external runtimes",
]
