server:
  profile: local-core
  host: "127.0.0.1"
  port: "${CODE_AGENT_SERVER_PORT:8081}"
  mode: release
  allowed_origins: "${CODE_AGENT_ALLOWED_ORIGINS:http://127.0.0.1:8081}"
  frontend_dir: "./frontend/dist"

harness:
  session_ledger_path: "${CODE_AGENT_SESSION_LEDGER_PATH:.agent/local/sessions.sqlite}"
  identity_path: "${CODE_AGENT_LOCAL_IDENTITY_PATH:.agent/local/identity/identity.sqlite}"

jwt:
  secret: "${JWT_SECRET:}"
  access_token_expire_hours: 24
  refresh_token_expire_days: 7

log:
  level: info
  format: json
  output_path: "./logs"
