version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeagent
      POSTGRES_USER: codeagent
      POSTGRES_PASSWORD: codeagent
    ports:
      - "5432:5432"
    volumes:
      - codeagent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeagent -d codeagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codeagent-postgres:
