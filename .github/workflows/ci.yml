name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Change scope and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"
      - name: Select validation scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: python -m scripts.ci_scope >> "$GITHUB_OUTPUT"
      - name: Install declared lightweight test dependencies
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          with open("pyproject.toml", "rb") as source:
              dependencies = tomllib.load(source)["project"]["optional-dependencies"]["test"]
          requirements = [item for item in dependencies if item.startswith(("pytest>", "pyyaml>"))]
          assert len(requirements) == 2
          subprocess.run([sys.executable, "-m", "pip", "install", *requirements], check=True)
          PY
      - name: Check documentation and workflow contracts
        run: python -m pytest -q tests/eval/test_ci_scope.py tests/eval/test_release_gate_workflow.py tests/eval/test_release_evidence.py
      - name: Check documentation whitespace
        if: steps.scope.outputs.full == 'false'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$CI_BASE_SHA" "$CI_HEAD_SHA"

  go:
    name: Go
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, Node 24
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The Go suite starts real Python orchestrator and MCP subprocesses.
      - run: python -m pip install -e ".[trace-e2e]"
      - name: Pin Python for subprocess tests
        run: echo "PYTHON_EXECUTABLE=${pythonLocation}/bin/python" >> "$GITHUB_ENV"
      - run: go test ./... -count=1
      - run: go vet ./...

  python:
    name: Python
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Python regressions also execute the Go Skill matrix and check JavaScript.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, Node 24
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,rag,eval]"
      # Evaluation tests intentionally isolate the network; fetch dependencies first.
      - run: go mod download
      - run: python -m pytest -q

  frontend:
    name: Frontend
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser UI regressions
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4174 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --output /dev/null --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:4174/
          node tests/webSocketReconnect.browser.mjs http://127.0.0.1:4174
          node tests/taskCapability.browser.mjs http://127.0.0.1:4174
          node tests/taskFinish.browser.mjs http://127.0.0.1:4174
      - run: npm run build:preview

  windows-startup:
    name: Windows startup contracts
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"
      - name: Install the declared pytest dependency
        shell: pwsh
        run: |
          $pytestRequirement = python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb')); print(next(d for d in p['project']['optional-dependencies']['test'] if d.startswith('pytest>')))"
          python -m pip install $pytestRequirement
      - run: python -m pytest -q tests/test_docker_desktop_startup.py
