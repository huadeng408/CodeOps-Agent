name: CodeOps-Agent release gate

on:
  # Evidence-backed release eligibility depends on external scorer and provider
  # receipts. Run it deliberately from Actions when a release candidate exists.
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          # The release gate accepts a receipt produced on the immediate
          # parent when the current commit only promotes curated evidence.
          # Keep history available so that source-pin validation is identical
          # locally and on the hosted runner.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          # terminal-bench 0.2.18 (the official Terminal-Bench adapter used
          # by the test suite) requires Python >=3.12.
          python-version: "3.12"

      - name: Pin Python runtime for Go subprocess E2E
        shell: bash
        run: echo "PYTHON_EXECUTABLE=${pythonLocation}/bin/python" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, Node 24
        with:
          go-version-file: go.mod

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,rag,eval]"

      - name: Prepare Go dependencies before offline evaluation tests
        run: go mod download

      - name: Run fail-closed release gate
        run: python -m eval.release_gate --json
