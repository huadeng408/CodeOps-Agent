name: CodeOps-Agent release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,rag,eval]"

      - name: Run fail-closed release gate
        run: python -m eval.release_gate --json
