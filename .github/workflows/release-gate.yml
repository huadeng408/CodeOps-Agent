name: CodeOps-Agent release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # The release gate accepts a receipt produced on the immediate
          # parent when the current commit only promotes curated evidence.
          # Keep history available so that source-pin validation is identical
          # locally and on the hosted runner.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # terminal-bench 0.2.18 (the official Terminal-Bench adapter used
          # by the test suite) requires Python >=3.12.
          python-version: "3.12"

      - name: Pin Python runtime for Go subprocess E2E
        shell: bash
        run: echo "PYTHON_EXECUTABLE=${pythonLocation}/bin/python" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,rag,eval]"

      - name: Run fail-closed release gate
        run: python -m eval.release_gate --json
